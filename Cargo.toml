[package]
name = "rlviser-rocketsim"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Stream RocketSim arena state to RLViser over UDP"
readme = "README.md"
homepage = "https://github.com/VirxEC/rlviser-rocketsim"
repository = "https://github.com/VirxEC/rlviser-rocketsim"
license = "MIT"
keywords = ["flatbuffers", "gamedev", "rocket-league", "simulation", "visualization"]
categories = ["game-development", "simulation", "visualization"]

[dependencies]
planus = "1.3.0"
rocketsim = "0.2.0"
serde = { version = "1.0.195", features = ["derive"] }

[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }

[build-dependencies]
planus-codegen = "1.3.0"
planus-translation = "1.3.0"
